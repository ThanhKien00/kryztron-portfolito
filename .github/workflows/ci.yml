name: CI

# Quality gate only — Vercel's Git integration owns building and deploying.
# Duplicating the build here would just burn Hobby build minutes.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches Vercel's default runtime, so a pass here means a pass there.
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs `next typegen` before `tsc`: `tsconfig.json` includes
      # `.next/types/**`, where Next writes the generated `PageProps` /
      # `LayoutProps` globals that typed routes rely on. `.next/` is
      # gitignored, so on a clean checkout those globals do not exist and
      # `tsc` fails with TS2304. `typegen` writes them without paying for a
      # full build. Same script locally, so CI cannot drift from `npm run
      # typecheck`.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
